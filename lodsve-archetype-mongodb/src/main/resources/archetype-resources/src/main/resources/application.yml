server:
  port: ${port}
  servlet:
    context-path: ${contextPath}

spring:
  mongodb:
    uri: mongodb://localhost:27017/${artifactId}
  data:
    mongodb:
      auto-index-creation: false

lodsve:
  swagger:
    enabled: true
  mongo:
    default-data-source-name: default
    data-source:
      archive:
        uri: mongodb://localhost:27017/${artifactId}_archive
